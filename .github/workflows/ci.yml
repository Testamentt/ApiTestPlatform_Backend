# CI 门禁（面试导向）：门禁测试 + 慢测试 + Docker 镜像构建验证。
# 本机无 Docker 时，docker-build job 即 Dockerfile/compose 的正确性验证闭环。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 重复 push 自动取消在跑 job（省 CI 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    name: 门禁测试（ruff + pytest + coverage）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Lint（ruff）
        run: |
          ruff check app tests
          ruff format --check .
      - name: 快速测试 + 全项目覆盖率（pytest 默认排除 slow）
        run: pytest --cov=app --cov-report=term-missing
      - name: 核心模块覆盖率门槛（services+utils ≥80，§11.3）
        run: coverage report --include='app/services/*.py,app/utils/*.py' --fail-under=80

  test-slow:
    name: 慢测试（e2e 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 确认 slow 用例收集非空（防 addopts -m 覆盖语义失效导致空跑绿灯，R3 批次）
        # why -o addopts= + 恰好一个 -q：无 -q 时 collect-only 输出树形格式（无 "::"）；
        # -qq（addopts 与步骤各带 -q 叠加）则降级为纯计数摘要——两种输出 grep 都必空，
        # 只有「清空 addopts + 单个 -q」输出完整用例 id（pytest 8.4 实测）
        run: pytest -o addopts= -q -m slow --collect-only | grep -q "::"
      - name: e2e 冒烟（mock 隔离，无需 Redis/LLM）
        run: pytest -m slow

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 配置
        run: docker compose config
      - name: 构建镜像（验证多阶段 + 非 editable 安装路径）
        run: docker build -t testplatform:ci .
      - name: 容器内 H1 白名单实测（python3* 前缀 + run_cmd 真实执行）
        # why：H1 修复此前仅代码层验证，本机无 Docker——CI runner 自带 Docker，
        # 挂载脚本进容器验证真实可执行路径过白名单 + 子进程真实执行（roadmap 待闭环项）。
        # PYTHONPATH=/app（R2-H1）：python 直接跑 /mnt 脚本时 sys.path 只有 /mnt + site-packages，
        # import app 会命中安装副本（PROJECT_ROOT 漂移到 site-packages，读不到 /app/config/settings.yaml，
        # 白名单回落默认值）——显式指向源码副本，与 uvicorn/celery 的 cwd 语义对齐
        run: docker run --rm -e PYTHONPATH=/app -v "$PWD/scripts/verify_container.py:/mnt/verify_container.py:ro" testplatform:ci python /mnt/verify_container.py
