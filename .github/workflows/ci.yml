# 本项目编码格式：UTF-8（无 BOM）。
# CI 门禁：门禁测试 + 慢测试 + Docker 镜像构建验证。
# 本机无 Docker 时，docker-build job 即 Dockerfile/compose 的正确性验证闭环。
name: CI

on:
  push:
    branches: [master]
  pull_request:

# 测试结果发布走 Checks / PR 注释，需显式授予写权限（默认 GITHUB_TOKEN 只读）
permissions:
  contents: read
  checks: write
  pull-requests: write

# 重复 push 自动取消在跑 job（省 CI 分钟）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-fast:
    name: 门禁测试（ruff + pytest + coverage）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Lint（ruff）
        run: |
          ruff check app tests scripts
          ruff format --check .
      - name: 文档结构门禁
        # why：链接可达 / 围栏语言 / H2 编号这类结构漂移只能靠人工翻文档发现，
        # 没有门禁，下一轮文档批量改动后必然重新漂移；脚本只校验 backend 仓库内的源文档。
        run: python scripts/doc_check.py
      - name: 文档与注释去 AI 味门禁
        # why：内部工单编号、协作过程叙述（审查后/本轮）、自贬措辞与生成式套话一旦回流，
        # 外部读者看到的就不是设计，而是协作痕迹。纯文本约定靠自觉必然回潮，固化成门禁才拦得住。
        # 规则见 RULES.md §20；语义类问题（编造数字、技术事实错误）仍靠人复核，正则抓不到。
        run: python scripts/doc_hygiene.py
      - name: 编码格式门禁
        # why：中文乱码几乎都来自三类可机械判定的漂移——文件不是 UTF-8（GBK/cp936 存盘）、
        # 带了 BOM、新文件忘了写首行声明。乱码一旦落到日志/报告/子进程输出，排查成本远高于
        # 在提交时拦下；本仓库的脚本与文档是重灾区，必须由门禁而不是自觉来保证。
        # 规则见 RULES.md 的「项目编码格式」一节。
        run: python scripts/encoding_check.py
      - name: 快速测试 + 全项目覆盖率（产出 JUnit / coverage / Allure 标准报告）
        # why：此前 CI 只有控制台文本，失败时只能翻日志找用例，PR/Checks 与 Jenkins 都无从发布结果；
        # junitxml + coverage xml + allure-results 是流水线消费的标准交换格式——报告要同时是「页面」和「制品」。
        run: |
          mkdir -p reports
          pytest --cov=app \
            --junitxml=reports/junit.xml \
            --alluredir=reports/allure-results --clean-alluredir \
            --cov-report=xml:reports/coverage.xml \
            --cov-report=html:reports/htmlcov \
            --cov-report=term-missing
      - name: 核心模块覆盖率门槛（services+utils ≥80）
        run: coverage report --include='app/services/*.py,app/utils/*.py' --fail-under=80
      - name: 生成 Allure HTML 报告（Jenkins 侧同源，故 CI 也用同一 CLI）
        # why continue-on-error：Allure 只是展示层，报告生成失败不该把已通过的测试门禁判红；
        # 版本固定 2.32.0 与 Jenkins 全局工具一致，避免本地/CI 报告渲染差异。
        if: always() && hashFiles('reports/allure-results/**') != ''
        continue-on-error: true
        run: |
          curl -sSL -o /tmp/allure.zip \
            https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.zip
          unzip -q /tmp/allure.zip -d /tmp/allure-cli
          /tmp/allure-cli/allure-2.32.0/bin/allure generate reports/allure-results \
            -o reports/allure-report --clean
      - name: 发布逐用例结果（Checks / PR 注释）
        # why hashFiles 守卫：pytest 收集期崩溃时不会产出 junit.xml，直接发布会让「测试失败」
        # 变成「发布步骤失败」，把真正的失败原因埋掉。
        # why continue-on-error：结果发布是辅助通道，权限/服务抖动不应把已通过的测试门禁判红
        if: always() && hashFiles('reports/junit.xml') != ''
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/junit.xml
      - name: 归档测试报告（JUnit + coverage + Allure 结果与 HTML）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  test-slow:
    name: 慢测试（e2e 冒烟）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: 确认 slow 用例收集非空（防 addopts -m 覆盖语义失效导致空跑绿灯）
        # why -o addopts= + 恰好一个 -q：无 -q 时 collect-only 输出树形格式（无 "::"）；
        # -qq（addopts 与步骤各带 -q 叠加）则降级为纯计数摘要——两种输出 grep 都必空，
        # 只有「清空 addopts + 单个 -q」输出完整用例 id（pytest 8.4 实测）
        run: pytest -o addopts= -q -m slow --collect-only | grep -q "::"
      - name: e2e 冒烟（mock 隔离，无需 Redis/LLM）
        run: pytest -m slow

  docker-build:
    name: Docker 镜像构建验证
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 校验 compose 配置
        run: docker compose config
      - name: 构建镜像（验证多阶段 + 非 editable 安装路径）
        run: docker build -t testplatform:ci .
      - name: 容器内白名单实测（python3* 前缀 + run_cmd 真实执行）
        # why：白名单此前只在代码层验证，本机无 Docker——CI runner 自带 Docker，
        # 挂载脚本进容器验证真实可执行路径能过白名单且子进程真实执行。
        # PYTHONPATH=/app：python 直接跑 /mnt 脚本时 sys.path 只有 /mnt + site-packages，
        # import app 会命中安装副本（PROJECT_ROOT 漂移到 site-packages，读不到 /app/config/settings.yaml，
        # 白名单回落默认值）——显式指向源码副本，与 uvicorn/celery 的 cwd 语义对齐
        run: docker run --rm -e PYTHONPATH=/app -v "$PWD/scripts/verify_container.py:/mnt/verify_container.py:ro" testplatform:ci python /mnt/verify_container.py
