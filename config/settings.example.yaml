# settings.example.yaml — 配置契约（Phase 1-4）
# 复制为 settings.yaml 使用（settings.yaml 已被 .gitignore 忽略）
# 环境变量（TESTPLATFORM_ 前缀）优先级最高，可覆盖以下任意字段
# 密钥一律不写在此文件，只放 .env（见 .env.example）

app:
  name: testplatform          # 应用名
  debug: false                # 开发模式（控制日志级别）
  version: 0.1.0
  host: 0.0.0.0
  port: 8000
  docs_enabled: true          # Swagger UI /docs 开关（§10.5：生产设 false 即关）

database:
  url: sqlite:///./data/platform.db   # 生产: postgresql://user:pass@host:5432/db
  echo: false                         # SQL 回显

redis:
  host: 127.0.0.1
  port: 6379
  password: ""                        # 经 TESTPLATFORM_REDIS_PASSWORD，勿写明文
  db: 0
  socket_timeout: 2.0                   # 健康检查探测超时（秒）

celery:
  broker_url: ""                      # 留空则由 redis 段组合生成
  result_backend: ""                  # 同上；仅短期状态 result_expires=3600
  soft_time_limit: 300                # 任务软超时
  time_limit: 360                     # 任务硬超时（必须 > visibility_timeout）
  visibility_timeout: 3600            # 必须 > time_limit，否则任务重复投递
  max_retries: 3                      # 仅瞬时异常重试
  result_expires: 3600               # result backend 仅短期状态，存活时长

execution:
  workspace_dir: .workspace           # 动态测试文件 / report.xml / HTML 报告
  base_url: http://httpbin.org        # 被测接口 base_url（写死，Phase 2 再补多环境）
  pytest_timeout: 300                 # subprocess 超时阈值（来自 config，禁止硬编码）
  command_whitelist: [python, pytest] # run_cmd 命令白名单

swagger:                              # Phase 2 影响分析（全带 default，缺失不阻塞启动）
  max_upload_bytes: 2000000           # Swagger 文档大小上限（超限拒绝解析）
  hash_version: 1                     # 哈希算法版本（升级递增，旧快照不重建）
  max_operation_ids_warn: 200         # operation 数告警阈值（超限只 warning 继续入库）

llm:                                  # Phase 3 AI 生成（全带 default，缺失不阻塞启动）
  api_key_env: DEEPSEEK_API_KEY       # API key 环境变量名（密钥只放 .env）
  base_url: https://api.deepseek.com  # DeepSeek（OpenAI 兼容协议）
  model: deepseek-chat
  temperature: 0                      # 确定性，可复现
  max_tokens: 4096                    # 生成上限
  max_input_chars: 50000              # 输入长度预检阈值（§9.3：超限拒绝）
  connect_timeout: 5                  # 连接超时（秒）
  read_timeout: 60                    # 读超时（秒）
  max_retries: 3                      # 瞬时异常重试次数
  retry_backoff: 1                    # 指数退避基数（秒）
  cost_per_1k_tokens: 0.001           # 成本估算单价（demo 均价，$/1K tokens）
  task_soft_timeout_seconds: 540      # 生成任务软超时（< 硬超时，留清理窗口）
  task_timeout_seconds: 600           # 生成任务硬超时（200 接口串行 ≈400s 兜底）

security:                             # Phase 4 Bearer Token 鉴权
  api_token: testplatform-dev-token   # dev 默认仅供本地演示；生产必须 TESTPLATFORM_SECURITY_API_TOKEN 覆盖（§3.1）

frontend:                             # Phase 4 CORS 白名单（MVP 零前端，默认空=不挂中间件）
  cors_origins: []                    # 前端做时填来源，如 [http://localhost:5173]
