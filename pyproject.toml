# 本项目编码格式：UTF-8（无 BOM）。
[project]
name = "testplatform-backend"
version = "0.1.0"
description = "智能化接口测试效能平台后端（FastAPI + SQLAlchemy + Celery）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = [
    "api-testing",
    "test-automation",
    "fastapi",
    "celery",
    "llm",
    "openapi",
    "pytest",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0.30,<2.1",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "python-dotenv>=1.0,<2.0",
    "celery>=5.4,<6.0",
    "redis>=5.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "openai>=1.0,<3.0",
    # JWT 鉴权通道（security.jwt_secret 为空时该通道关闭；依赖随包安装以保持导入稳定）
    "PyJWT>=2.8,<3.0",
    # why 显式声明：kombu 的 redis 传输在模块顶层无条件 import packaging.version，
    # 但 kombu 自身未把它列为依赖。本地 dev 环境因 pytest 顺带装了 packaging 而不报错，
    # 容器只装运行时依赖 → ModuleNotFoundError，Celery Worker/Beat 直接起不来。
    "packaging>=24,<27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-cov>=5,<7",
    "ruff>=0.16,<0.17",
    # why 必须显式声明：ci.yml 与 Jenkinsfile 的 pytest 步骤都传了
    # `--alluredir=reports/allure-results --clean-alluredir`，该参数由 allure-pytest 插件提供。
    # 缺它时 pytest 直接以退出码 4（usage error）中断，报 "unrecognized arguments: --alluredir"
    # → 新环境 test-fast / Jenkins 测试阶段必红。本机曾因手工 pip install 过而不复现，属环境漂移。
    "allure-pytest>=2.13,<3",
]
# why 独立 extra：execution.executor=local 时执行层在子进程里跑 `python -m pytest` 生成 JUnit，
# 故 pytest 是该模式的**运行时**依赖（而非仅开发期）。容器镜像必须带上它，
# 否则任务会以 parse 阶段 'No such file or directory: report.xml' 失败（pytest 根本没跑起来）。
executor = [
    "pytest>=8.2,<9.0",
]
# 切 PostgreSQL 时 `pip install -e ".[postgres]"`——SQLAlchemy 侧无需改代码
# （方言差异已收敛在 app/core/database.py 的纯函数里），只换驱动与 database.url
postgres = [
    "psycopg[binary]>=3.2,<4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# why：ruff ≥0.11 会格式化 Markdown 里内嵌的 Python 片段——文档里的代码块是**示意片段**
# （刻意截取/简化），不该被 formatter 自动重排；否则任何一行超长注释都会让 CI 的
# `ruff format --check .` 挂掉。docs 也不参与 lint（CI 只显式检查 app/tests/scripts）。
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]  # B008: FastAPI Depends() 默认参数误报；E501: 长中文注释行

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short -m 'not slow'"
markers = [
    "unit: 纯逻辑单元测试",
    "api: FastAPI 接口测试",
    "tasks: Celery 任务测试（eager）",
    "integration: 端到端真实链路（慢）",
    "slow: 端到端/集成冒烟（不随默认 CI，用 -m slow 单独跑）",
]

[tool.coverage.report]
# 全项目覆盖率门槛；核心模块（services+utils）≥80 由 CI 单独 fail-under 校验
fail_under = 60
show_missing = true
skip_covered = true
